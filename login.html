<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AegisNet Security</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
      <div class="text-center mb-8">
        <a href="index.html" class="text-2xl font-bold text-white">Aegis<span class="text-blue-500">Net</span> Security</a>
        <p class="text-sm text-slate-400 mt-2">Masuk ke Portal Menu Utama</p>
      </div>

      <div id="errorMsg" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm"></div>

      <form onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input type="text" id="username" required placeholder="Masukkan username (admin)"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-700 focus:border-blue-500 focus:outline-none text-white" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" id="password" required placeholder="Masukkan password (admin123)"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-700 focus:border-blue-500 focus:outline-none text-white" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition">
          Login
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-400">
        Belum punya akun? <a href="register.html" class="text-blue-400 hover:underline">Registrasi di sini</a>
      </p>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-sm text-slate-400">
    @Copyright by 24552011266_Azriel Muhamad Bintang_TIF RP 24E CNS
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
